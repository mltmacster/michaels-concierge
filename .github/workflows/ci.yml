name: Foundation CI

on:
  push:
    branches: [main, "phase0/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; packageManager is the single version source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret scan (history and source)
        run: |
          bash scripts/install-gitleaks.sh
          "$HOME/.local/bin/gitleaks" git --redact --log-opts='--all --full-history --pretty=medium --no-color' .
          source=$(mktemp -d)
          git archive HEAD | tar -x -C "$source"
          "$HOME/.local/bin/gitleaks" dir --redact "$source"
          rm -rf "$source"
      - name: Format, lint, types, docs, tests, build, production smoke
        run: pnpm verify
      - name: Production dependency security gate
        run: pnpm audit:production
      - name: Browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop/mobile and failure-state browser smoke
        run: pnpm test:browser
      - name: Container profile build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build --tag michaels-concierge:foundation .
      - name: Assemble foundation artifact
        run: |
          mkdir -p artifacts
          tar -czf artifacts/foundation-build.tar.gz dist package.json pnpm-lock.yaml pnpm-workspace.yaml patches .env.example README.md
          sha256sum artifacts/foundation-build.tar.gz > artifacts/foundation-build.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-${{ github.sha }}
          path: artifacts/foundation-build.*
          retention-days: 14

  deliver:
    name: Foundation prerelease delivery
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download same-run verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "foundation-$GITHUB_SHA" --dir artifacts
      - name: Publish explicitly labelled foundation prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/foundation-build.* \
            --verify-tag --prerelease --target "$GITHUB_SHA" \
            --title "Michaels Concierge — foundation $GITHUB_REF_NAME" \
            --notes "Verified engineering foundation artifact. Customer requests, provider recommendations, bookings and billing are not enabled. This is not a production concierge service launch."
