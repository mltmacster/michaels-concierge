name: Foundation CI

on:
  push:
    branches: [main, "phase0/**", "phase1/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4; packageManager is the single version source
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Secret scan (history and source)
        run: |
          bash scripts/install-gitleaks.sh
          "$HOME/.local/bin/gitleaks" git --redact --log-opts='--all --full-history --pretty=medium --no-color' .
          source=$(mktemp -d)
          git archive HEAD | tar -x -C "$source"
          "$HOME/.local/bin/gitleaks" dir --redact "$source"
          rm -rf "$source"
      - name: Format, lint, types, docs, tests, build, production smoke
        run: pnpm verify
      - name: Production dependency security gate
        run: pnpm audit:production
      - name: Browser dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop/mobile and failure-state browser smoke
        run: pnpm test:browser
      - name: Preserve isolated browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-audit-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Container profile build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build --tag michaels-concierge:foundation .
      - name: Assemble foundation artifact
        run: |
          mkdir -p artifacts
          printf '%s\n' "$GITHUB_SHA" > artifacts/VERIFIED_SOURCE.txt
          tar -czf artifacts/foundation-build.tar.gz dist package.json pnpm-lock.yaml pnpm-workspace.yaml patches drizzle scripts .env.example README.md HANDOFF.md CONTRIBUTING.md SECURITY.md Dockerfile docs -C artifacts VERIFIED_SOURCE.txt
          (cd artifacts && sha256sum foundation-build.tar.gz > foundation-build.sha256)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: foundation-${{ github.sha }}
          path: artifacts/foundation-build.*
          retention-days: 14

  identity-database:
    name: identity-database
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: disposable-root-only
          MYSQL_DATABASE: mgecs_test
          MYSQL_USER: mgecs_test
          MYSQL_PASSWORD: disposable-fixture-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify guard rejects absent acknowledgements
        run: |
          if env -u DATABASE_URL -u AI_UNK_TEST_DATABASE -u RUN_DATABASE_TESTS node scripts/database-test.mjs; then
            echo "Guard failed open" >&2
            exit 1
          fi
      - name: Apply reviewed migrations and test isolated identity persistence
        env:
          AI_UNK_TEST_DATABASE: "true"
          RUN_DATABASE_TESTS: "true"
          DATABASE_URL: mysql://mgecs_test:disposable-fixture-only@127.0.0.1:3306/mgecs_test
        run: pnpm test:database
  deliver:
    name: Foundation prerelease delivery
    needs: [quality, identity-database]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download same-run verified build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name "foundation-$GITHUB_SHA" --dir artifacts
      - name: Publish explicitly labelled foundation prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/foundation-build.* \
            --verify-tag --prerelease --target "$GITHUB_SHA" \
            --title "Michaels Concierge — foundation $GITHUB_REF_NAME" \
            --notes "Verified engineering foundation artifact. Customer requests, provider recommendations, bookings and billing are not enabled. This is not a production concierge service launch."
